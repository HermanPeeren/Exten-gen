name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The browser tests use node:test and nothing else, so there is
          # nothing to install - but the version is pinned rather than left to
          # whatever the runner image happens to ship.
          node-version: '20'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Two things need a real Joomla, and both of them run after this.
      #
      # PHPStan resolves the component's base classes against it: without one,
      # every `extends AdminModel` is an unknown class and the analysis says
      # nothing.
      #
      # And the unit suite reads generated YAML back through `symfony/yaml`,
      # which Joomla ships under `libraries/vendor`. That test checks its
      # structure either way and only parses when a parser is there - so
      # fetching this *before* the tests rather than after is the difference
      # between the deep half running in CI and skipping in CI, which is the
      # kind of silence this repository keeps finding by looking for it.
      #
      # /joomla is git-ignored, so CI fetches its own.
      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.1.3

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs
